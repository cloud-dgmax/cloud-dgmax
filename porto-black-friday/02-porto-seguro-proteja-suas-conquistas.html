<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Porto Seguro — Proteja suas conquistas</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body style="margin:0;background:#111;min-height:100vh;display:flex;justify-content:center;align-items:flex-start;padding:12px;">
<div id="porto-protect-v2" class="w-full flex justify-center"><style>#porto-protect-v2 .phone{width:min(100%,390px);border-radius:28px;background:linear-gradient(165deg,#032b55,#006da4);padding:24px;color:#fff;font-family:Arial,sans-serif}.logo{font-size:30px;font-weight:900;letter-spacing:-2px;color:#fff}.tag{font-size:11px;font-weight:900;letter-spacing:1.2px;color:#65ddff}.title{font-size:30px;line-height:1;font-weight:900;margin:17px 0 7px;color:#fff}.intro{font-size:13px;color:#fff}.hero-lock{text-align:center;font-size:64px;margin:15px 0;filter:drop-shadow(0 8px 8px #001b2f66)}.assets{display:grid;gap:10px}.asset{background:#fff;color:#08365d;border-radius:18px;padding:13px;display:grid;grid-template-columns:55px 1fr auto;align-items:center;gap:10px;transition:.25s}.asset .icon{font-size:36px}.asset b,.asset small{color:#08365d}.asset button{border:0;border-radius:12px;padding:10px;background:#dff6ff;color:#00628d;font-weight:900;cursor:pointer}.asset.safe{background:#08755c;color:#fff}.asset.safe b,.asset.safe small{color:#fff}.asset.safe button{background:#082f25;color:#fff}.protected{font-size:24px;margin-right:3px}.reward{display:none;background:#071a2a;color:#fff;border-radius:19px;padding:17px;text-align:center;margin-top:13px}.reward.show{display:block}.reward strong{font-size:22px;display:block;color:#fff}.reward span{font-size:13px;color:#fff}.cta{margin-top:11px;width:100%;padding:13px;border:0;border-radius:13px;background:#fff;color:#082d50;font-weight:900;cursor:pointer}</style><div class="phone"><div class="logo">porto</div><div class="tag">BLACK FRIDAY • PORTO SEGURO</div><div class="title">Proteja suas conquistas.</div><div class="intro">Ative a proteção Porto para cada item.</div><div class="hero-lock">🔐❤️</div><div class="assets"><div class="asset"><div class="icon">📱</div><div><b>Seu celular</b><br><small>Seguro Celular</small></div><button type="button">PROTEGER</button></div><div class="asset"><div class="icon">🚗</div><div><b>Seu carro</b><br><small>Seguro Auto</small></div><button type="button">PROTEGER</button></div><div class="asset"><div class="icon">🏠</div><div><b>Sua casa</b><br><small>Seguro Residencial</small></div><button type="button">PROTEGER</button></div></div><div class="reward" aria-live="polite"><strong>🔐❤️ PROTEÇÃO COMPLETA</strong><span>Ofertas Black Friday desbloqueadas para você.</span><button class="cta" type="button">VER OFERTAS</button></div></div><script>(()=>{const r=document.querySelector('#porto-protect-v2');if(r.dataset.init)return;r.dataset.init='1';let n=0;r.querySelectorAll('.asset button').forEach(b=>b.addEventListener('click',()=>{const a=b.closest('.asset');if(a.classList.contains('safe'))return;a.classList.add('safe');b.innerHTML='<span class="protected">🔐❤️</span> PROTEGIDO';n++;if(n===3)r.querySelector('.reward').classList.add('show')}));r.querySelector('.cta').addEventListener('click',e=>e.currentTarget.textContent='OFERTA SELECIONADA ✓')})();</script></div>
</body>
</html>
