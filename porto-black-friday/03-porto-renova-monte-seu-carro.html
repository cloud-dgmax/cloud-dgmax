<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Porto Renova — Monte seu carro</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body style="margin:0;background:#111;min-height:100vh;display:flex;justify-content:center;align-items:flex-start;padding:12px;">
<div id="porto-renova-v2" class="w-full flex justify-center"><style>#porto-renova-v2 .phone{width:min(100%,390px);border-radius:28px;background:linear-gradient(160deg,#082748,#064f73);color:#fff;padding:24px;font-family:Arial,sans-serif}.logo{font-size:29px;font-weight:900;letter-spacing:-2px;color:#fff}.tag{font-size:11px;color:#65e5d3;font-weight:900;letter-spacing:1px}.title{font-size:29px;line-height:1;font-weight:900;margin:18px 0 5px;color:#fff}.intro,.status{font-size:12px;color:#fff}.garage{margin:17px 0 10px;background:#eaf5f6;border-radius:25px;padding:16px;position:relative}.dropzone{position:relative;border:3px dashed transparent;border-radius:20px;transition:.2s}.dropzone.hot{border-color:#29c5a4;background:#d8faf2}.parts{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:13px 0}.part{min-height:75px;border:2px solid #ffffff80;border-radius:15px;background:#ffffff17;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900;font-size:10px;cursor:grab;touch-action:none}.part span{font-size:30px}.part.selected{background:#fff;color:#0b4964}.part.done{opacity:.35;cursor:default}.reward{display:none;background:#fff;color:#092f4a;border-radius:18px;padding:16px;text-align:center;margin-top:13px}.reward.show{display:block}.reward b{font-size:21px;display:block;color:#092f4a}.reward span{font-size:12px;color:#486679}.cta{margin-top:11px;border:0;border-radius:13px;background:#09243a;color:#fff;padding:13px;width:100%;font-weight:900;cursor:pointer}</style><div class="phone"><div class="logo">porto renova</div><div class="tag">BLACK FRIDAY • MONTE SEU CARRO</div><div class="title">Arraste as peças para o carro.</div><div class="intro">No celular, toque na peça e depois no carro.</div><div class="garage"><div class="dropzone" tabindex="0"><svg viewBox="0 0 330 150" width="100%" role="img" aria-label="Carro incompleto"><path d="M46 91l17-39c6-14 17-21 34-21h121c19 0 30 7 42 24l24 36 20 5v26H27V97z" fill="#9fd5e6" stroke="#315a6b" stroke-width="5"/><circle cx="87" cy="119" r="21" fill="#233641"/><circle cx="246" cy="119" r="21" fill="#233641"/><rect id="p-light" x="269" y="72" width="24" height="12" rx="5" fill="#f6fbfd" opacity=".18"/><rect id="p-mirror" x="211" y="46" width="20" height="11" rx="4" fill="#f6fbfd" opacity=".18"/><path id="p-bumper" d="M268 111h35" stroke="#f6fbfd" stroke-width="9" stroke-linecap="round" opacity=".18"/><circle id="p-wheel" cx="87" cy="119" r="10" fill="#f6fbfd" opacity=".18"/></svg></div></div><div class="parts"><button class="part" data-piece="light" type="button"><span>💡</span>Farol</button><button class="part" data-piece="mirror" type="button"><span>🪞</span>Retrovisor</button><button class="part" data-piece="bumper" type="button"><span>🚘</span>Para-choque</button><button class="part" data-piece="wheel" type="button"><span>⚙️</span>Roda</button></div><div class="status">0 de 4 peças instaladas</div><div class="reward" aria-live="polite"><b>🚗 CARRO COMPLETO!</b><span>Oferta Black Friday Renova desbloqueada.</span><button class="cta" type="button">ENCONTRAR MINHA PEÇA</button></div></div><script>(()=>{const r=document.querySelector('#porto-renova-v2');if(r.dataset.init)return;r.dataset.init='1';const zone=r.querySelector('.dropzone'),status=r.querySelector('.status'),reward=r.querySelector('.reward');let selected=null,count=0,dragging=null;const install=(piece,btn)=>{if(btn.classList.contains('done'))return;const el=r.querySelector('#p-'+piece);if(el)el.setAttribute('opacity','1');btn.classList.remove('selected');btn.classList.add('done');btn.querySelector('span').textContent='✓';count++;status.textContent=count+' de 4 peças instaladas';selected=null;if(count===4)reward.classList.add('show')};r.querySelectorAll('.part').forEach(btn=>{btn.addEventListener('click',()=>{if(btn.classList.contains('done'))return;r.querySelectorAll('.part').forEach(x=>x.classList.remove('selected'));selected=btn;btn.classList.add('selected')});btn.addEventListener('pointerdown',e=>{if(btn.classList.contains('done'))return;dragging=btn;btn.setPointerCapture?.(e.pointerId)});btn.addEventListener('pointerup',e=>{if(!dragging)return;const z=zone.getBoundingClientRect();if(e.clientX>=z.left&&e.clientX<=z.right&&e.clientY>=z.top&&e.clientY<=z.bottom)install(btn.dataset.piece,btn);zone.classList.remove('hot');dragging=null})});zone.addEventListener('pointerenter',()=>{if(dragging)zone.classList.add('hot')});zone.addEventListener('pointerleave',()=>zone.classList.remove('hot'));zone.addEventListener('click',()=>{if(selected)install(selected.dataset.piece,selected)});r.querySelector('.cta').addEventListener('click',e=>e.currentTarget.textContent='PEÇAS ENCONTRADAS ✓')})();</script></div>
</body>
</html>
